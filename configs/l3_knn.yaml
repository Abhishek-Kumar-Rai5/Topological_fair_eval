# L3 (EXPLORATORY, docs/plan_A_lite.md): the E3 swap test with a kNN distance detector instead of Isolation Forest.
experiment: L3
dataset: SMD
data_root: data/SMD
windows: {size: 60, step: 10, label_tail: 10}
split: {val_frac: 0.2}
threshold: {false_alarm_rate: 0.01, on: validation}
seeds: [0]                    # deterministic: one run
minutes_per_point: 1.0
detector: {name: knn, k: 5}   # mean Euclidean distance to the 5 nearest training windows; scaler fitted on training features
feature_sets: ["F1", "F1+F2", "F1+F3", "F1+F2+F3", "F1+F2+F3-H0", "F1+F2+F3-H1"]   # -H0 / -H1: the halves of E3's F3 (as E3x)
comparisons:
  main_gain: {a: "F1+F2+F3", b: "F1+F2"}
  swap_gain: {a: "F1+F3", b: "F1+F2"}
  h0_gain: {a: "F1+F2+F3-H0", b: "F1+F2"}
  h1_gain: {a: "F1+F2+F3-H1", b: "F1+F2"}
point_adjustment: false
bootstrap: {cluster: machine, n_resamples: 2000, ci: 0.95}
verdict: {equivalence_margin: 0.02, min_positive_windows: 20, min_normal_windows: 20}
